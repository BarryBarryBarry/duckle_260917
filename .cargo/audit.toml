# Accepted dependency advisories.
#
# Read this with docs/security/reference/dependency-advisories.md, which records
# the reachability analysis behind every entry. Nothing is listed here without a
# corresponding section there, and nothing is listed here that has a fix
# available - if an upgrade exists, the upgrade is the answer.
#
# The point of this file is that CI fails on a NEW advisory. An empty ignore
# list would mean CI is permanently red and therefore ignored by everyone, which
# is how a scanner stops being a control.
#
# Review date: 2026-12-07. Each entry below states what would let it be removed.

[advisories]
ignore = [
    # rsa 0.9 - Marvin timing sidechannel. No fixed version exists upstream.
    # NOT REACHABLE: the crate is used at one site (crates/duckdb-engine, the
    # Snowflake key-pair auth path) to read a LOCAL private key and derive the
    # public-key SHA-256 fingerprint for the JWT issuer string. There is no RSA
    # decryption anywhere in the tree, and the JWT itself is signed by
    # jsonwebtoken. Marvin requires chosen-ciphertext decryption timing.
    # Remove when: the rsa crate publishes a constant-time release.
    "RUSTSEC-2023-0071",

    # rustls-webpki 0.102.8 - certificate path validation defects.
    # Pulled in by imap 3.0.0-alpha.15 (via rustls-connector 0.19 and rustls
    # 0.22), the newest published version, so there is no upgrade to take.
    # tiberius was the other path until 0.13 moved SQL Server to rustls 0.23.
    # Duckle's own TLS - the console, the HTTP sources, the updater - is on
    # rustls-webpki 0.103.16, which is unaffected.
    # Remove when: imap publishes a release on rustls 0.23+, or Duckle opens
    # the IMAP TLS connection itself and drops imap's rustls-tls feature.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # Distrusted emSign intermediates (2026-10-20). The same imap-only copy;
    # Duckle's own TLS is on 0.103.16, which rejects them.
    "RUSTSEC-2026-0382",

    # rustls 0.22.4 - the same imap path pins it; Duckle's own TLS is 0.23.46.
    # NOT REACHABLE: -0346 needs a custom ClientSessionStore that Debug-prints
    # session values (rustls-connector uses the redacted built-in store);
    # -0349 strips a post-quantum key share, which rustls 0.22 never offers.
    # Remove when: as for rustls-webpki 0.102.8 above.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",

    # quick-xml 0.40 - denial of service on hostile XML.
    # Duckle's own XML reading is on quick-xml 0.42, which is past the fix. This
    # copy comes only through the optional duckle-lance sidecar, inside
    # lance-namespace-impls' Azure credential vendor, where the XML parsed is
    # Azure's own credential response rather than pipeline input.
    # Remove when: lancedb takes a lance-namespace-impls release on 0.41+.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
