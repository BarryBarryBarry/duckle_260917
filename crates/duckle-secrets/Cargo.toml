[package]
name = "duckle-secrets"
description = "Workspace secret encryption and saved-connection resolution shared by the desktop app and the headless runner."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
getrandom = "0.4"
serde_json = { workspace = true }
duckle-metadata = { workspace = true }

# flock(2) for the connection store's cross-process lock. Windows uses a
# share-mode open, which is in std.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
duckle-duckdb-engine = { workspace = true }
tempfile = "3.10"
