<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duckle - Sign in</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cline%20x1%3D%2714%27%20y1%3D%2716%27%20x2%3D%2732%27%20y2%3D%2732%27%20stroke%3D%27%23A100FF%27%20stroke-width%3D%273.4%27%20stroke-linecap%3D%27round%27%2F%3E%3Cline%20x1%3D%2732%27%20y1%3D%2732%27%20x2%3D%2750%27%20y2%3D%2748%27%20stroke%3D%27%23A100FF%27%20stroke-width%3D%273.4%27%20stroke-linecap%3D%27round%27%2F%3E%3Crect%20x%3D%275%27%20y%3D%277%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%275.5%27%20fill%3D%27%23C88DF0%27%2F%3E%3Crect%20x%3D%2723%27%20y%3D%2723%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%275.5%27%20fill%3D%27%23A100FF%27%2F%3E%3Crect%20x%3D%2741%27%20y%3D%2739%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%275.5%27%20fill%3D%27%237500C0%27%2F%3E%3C%2Fsvg%3E">
<style>
  :root {
    --bg: #0f1320; --surface: #161b2b; --surface-2: #1d2335;
    --line: #2c3349; --line-2: #3a4360;
    --ink: #eef1f8; --muted: #9aa4bd; --faint: #6b7593;
    --accent: #ff7a45; --accent-strong: #ed5f22; --orange: #ff8a3d; --red: #f0556b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 14px/1.55 "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  .card { width: min(380px, calc(100vw - 32px)); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 28px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.18); }
  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; }
  .brand b { font-size: 16px; letter-spacing: .2px; display: block; }
  .brand span { font-size: 11px; color: var(--muted); }
  h1 { font-size: 17px; margin: 0 0 6px; font-weight: 650; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 11.5px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  input { width: 100%; background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
    font-size: 13px; outline: none; font-family: Consolas, monospace; }
  input:focus { border-color: var(--line-2); }
  button { width: 100%; margin-top: 14px; background: var(--accent); color: #07090f;
    border: 1px solid var(--accent); border-radius: 9px; padding: 10px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: .12s; }
  button:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: var(--red); font-size: 12.5px; margin-top: 12px; min-height: 17px; }
  .hint { color: var(--faint); font-size: 11.5px; margin-top: 16px;
    border-top: 1px solid var(--line); padding-top: 14px; }
  .hint code { color: var(--accent); font-family: Consolas, monospace; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg class="logo" width="34" height="34" viewBox="0 0 64 64" aria-hidden="true">
        <line x1="14" y1="16" x2="32" y2="32" stroke="#A100FF" stroke-width="3.4" stroke-linecap="round"/>
        <line x1="32" y1="32" x2="50" y2="48" stroke="#A100FF" stroke-width="3.4" stroke-linecap="round"/>
        <rect x="5" y="7" width="18" height="18" rx="5.5" fill="#C88DF0"/>
        <rect x="23" y="23" width="18" height="18" rx="5.5" fill="#A100FF"/>
        <rect x="41" y="39" width="18" height="18" rx="5.5" fill="#7500C0"/>
      </svg>
      <div><b>Duckle</b><span>Management console</span></div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">This console can run pipelines on the host, so it needs a token.</p>
    <form id="f" autocomplete="off">
      <label for="token">Console token</label>
      <input id="token" name="token" type="password" required autofocus
             autocomplete="current-password" spellcheck="false">
      <button id="go" type="submit">Sign in</button>
    </form>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <p class="hint">Set with <code>DUCKLE_CONSOLE_TOKEN</code> or <code>--token</code> when
      starting the runner. Per-person tokens and roles live in
      <code>.duckle/console-users.json</code>.</p>
  </main>
<script>
// The token goes in the request body, never the URL: a query string ends up in
// the server log, the browser history, and any proxy along the way.
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const go = document.getElementById('go');
  const err = document.getElementById('err');
  err.textContent = '';
  go.disabled = true;
  try {
    const r = await fetch('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('token').value }),
    });
    if (r.ok) { location.replace('/'); return; }
    err.textContent = r.status === 401
      ? 'That token was not accepted.'
      : 'Sign-in failed (' + r.status + ').';
  } catch (_) {
    err.textContent = 'Could not reach the console.';
  }
  go.disabled = false;
});
</script>
</body>
</html>
